<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player sheet · WebGL</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #2a2722;
        color: #d4c2a0;
        font: 14px/1.5 ui-monospace, "Courier New", Courier, monospace;
      }

      main {
        padding: 24px;
      }

      #gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }

      figure {
        margin: 0;
      }

      figcaption {
        margin-bottom: 8px;
        color: #5c5346;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        background: #4a4740;
      }

      canvas.sheet {
        width: 336px;
        height: 432px;
      }

      canvas.sprite {
        width: 64px;
        height: 64px;
      }

      #flight {
        width: 640px;
        height: 240px;
        margin: 0 0 8px;
      }

      button {
        margin-top: 12px;
        padding: 8px 14px;
        border: 2px solid #a32020;
        background: transparent;
        color: #a32020;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p>WebGL 正交烘焙 · 角色与武器共用相机与格尺寸 · 透明底</p>
      <p id="status"></p>
      <canvas id="flight" width="640" height="240"></canvas>
      <p>弹道预览：左手枪点射 · 右冲锋枪连发</p>
      <div id="gallery"></div>
    </main>
    <script type="module" src="/src/tools/player-sheet-main.ts"></script>
  </body>
</html>
