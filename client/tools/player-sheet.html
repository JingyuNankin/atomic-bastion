<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player sheet · WebGL</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0f14;
        color: #e8f4ff;
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
      }

      main {
        padding: 24px;
      }

      #gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }

      figure {
        margin: 0;
      }

      figcaption {
        margin-bottom: 8px;
        color: #8aa4b8;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        background: #2a3038;
      }

      canvas.sheet {
        width: 336px;
        height: 432px;
      }

      canvas.sprite {
        width: 64px;
        height: 64px;
      }

      button {
        margin-top: 12px;
        padding: 8px 14px;
        border: 1px solid #7ec8ff;
        background: rgba(126, 200, 255, 0.1);
        color: #e8f4ff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p>WebGL 正交烘焙 · 角色与武器共用相机与格尺寸 · 透明底</p>
      <p id="status"></p>
      <div id="gallery"></div>
    </main>
    <script type="module" src="/src/tools/player-sheet-main.ts"></script>
  </body>
</html>
